name: Simulator snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to rebuild
        required: true
        default: main
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: reantenna-snapshot-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Build simulator application
        run: |
          xcodebuild \
            -project ReAntenna.xcodeproj \
            -scheme ReAntenna \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package reproducibility metadata
        run: |
          mkdir -p dist
          git rev-parse HEAD > dist/commit.txt
          xcodebuild -version > dist/xcode-version.txt
          xcrun --sdk iphonesimulator --show-sdk-version > dist/sdk-version.txt
          ditto -c -k --sequesterRsrc --keepParent \
            DerivedData/Build/Products/Release-iphonesimulator/ReAntenna.app \
            dist/ReAntenna-Simulator.zip

      - name: Upload snapshot
        uses: actions/upload-artifact@v5
        with:
          name: reantenna-simulator-${{ github.run_id }}
          path: dist/
          retention-days: 30

      - name: Keep only the newest three snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("reantenna-simulator-")) | [.created_at, .id] | @tsv' \
            | sort -r \
            | tail -n +4 \
            | cut -f2 \
            | while read -r artifact_id; do
                [ -n "$artifact_id" ] && gh api -X DELETE \
                  "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              done
