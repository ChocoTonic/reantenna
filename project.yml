name: ReAntenna
options:
  bundleIdPrefix: com.chocotonic.reantenna
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  AntennaCore:
    type: framework
    platform: iOS
    sources:
      - Sources/AntennaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chocotonic.reantenna.core
        GENERATE_INFOPLIST_FILE: YES
  ReAntenna:
    type: application
    platform: iOS
    sources:
      - ReAntennaApp
    configFiles:
      Debug: Config/RedditConfig.xcconfig
      Release: Config/RedditConfig.xcconfig
    dependencies:
      - target: AntennaCore
    info:
      path: ReAntennaApp/Info.plist
      properties:
        CFBundleDisplayName: ReAntenna
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.chocotonic.reantenna.oauth
            CFBundleURLSchemes:
              - reantenna
        LSApplicationCategoryType: public.app-category.news
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        RedditClientID: "$(REDDIT_CLIENT_ID)"
        RedditDeveloperUsername: "$(REDDIT_DEVELOPER_USERNAME)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chocotonic.reantenna
        PRODUCT_NAME: ReAntenna
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
  AntennaCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/AntennaCoreTests
    dependencies:
      - target: AntennaCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ReAntenna:
    build:
      targets:
        ReAntenna: all
        AntennaCoreTests: [test]
    test:
      targets:
        - AntennaCoreTests
