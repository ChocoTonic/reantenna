name: Threadline
options:
  bundleIdPrefix: com.example.threadline
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  AntennaCore:
    type: framework
    platform: iOS
    sources:
      - Sources/AntennaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.threadline.core
        GENERATE_INFOPLIST_FILE: YES
  Threadline:
    type: application
    platform: iOS
    sources:
      - AntennaApp
    dependencies:
      - target: AntennaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.threadline.app
        PRODUCT_NAME: Threadline
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Threadline
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  AntennaCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/AntennaCoreTests
    dependencies:
      - target: AntennaCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Threadline:
    build:
      targets:
        Threadline: all
        AntennaCoreTests: [test]
    test:
      targets:
        - AntennaCoreTests
